[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-data-analyst"
version = "2.0.0"
description = "Blackboard-style multi-agent analytics pipeline for sales data, with a Streamlit dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.1", "numpy>=1.26", "scikit-learn>=1.4", "plotly>=5.20", "streamlit>=1.40",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
analyst = "analyst.cli:main"

[tool.setuptools.packages.find]
include = ["analyst*", "ui*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501", "B905", "N818"]
